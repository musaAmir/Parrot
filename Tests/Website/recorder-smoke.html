<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Parrot native recording test</title><style>body{font:16px system-ui;margin:40px;max-width:800px}button{font:inherit;padding:12px;margin:8px 8px 8px 0}pre{background:#eee;padding:20px;white-space:pre-wrap}</style>
<h1>Native browser recording test</h1><p>Generated audio only. No microphone request. Playback is muted. This test page is not deployed.</p>
<button id="start">Start generated take</button><button id="stop" disabled>Stop and play</button><button id="clear">Clear</button><pre id="result">Ready</pre>
<script type="module">
import { VoiceDemo, createBrowserPlatform } from '../../docs/voice-demo.js';
let context, destination, oscillator, clipBytes=0, clipType='', track, audio, latest;
const platform = createBrowserPlatform();
platform.supported = Boolean(window.MediaRecorder && window.AudioContext);
platform.requestStream = async () => destination.stream;
const originalURL = platform.createURL;
platform.createURL = blob => { clipBytes=blob.size; clipType=blob.type; return originalURL(blob); };
const originalAudio = platform.createAudio;
platform.createAudio = url => { audio=originalAudio(url); audio.muted=true; return audio; };
function stopSource() { if(context && context.state!=='closed') void context.close(); }
const demo = new VoiceDemo({ platform, onChange(state) {
  latest=state;
  document.querySelector('#start').disabled=['recording','processing','requesting'].includes(state.state);
  document.querySelector('#stop').disabled=state.state!=='recording';
  if(['ready','playing','idle','error'].includes(state.state)) stopSource();
  document.querySelector('#result').textContent=JSON.stringify({state:state.state,message:state.message,clipBytes,clipType,inputState:track?.readyState??'none',hasClip:state.hasClip,progress:state.progress,decodedAudio:audio?.readyState>=2},null,2);
}});
document.querySelector('#start').onclick = async () => {
  context=new AudioContext(); await context.resume();
  destination=context.createMediaStreamDestination(); track=destination.stream.getAudioTracks()[0];
  oscillator=context.createOscillator(); oscillator.frequency.value=220; oscillator.connect(destination); oscillator.start();
  await demo.start();
};
document.querySelector('#stop').onclick=()=>demo.stop();
document.querySelector('#clear').onclick=()=>{demo.cancel();stopSource();};
window.addEventListener('pagehide',()=>{demo.cancel();stopSource();});
</script></html>
